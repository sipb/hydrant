["11.S946"]
name = "Impact Ventures: Venture Building in Growth Markets"
isVariableUnits = true
lectureUnits = 0
labUnits = 0
preparationUnits = 0
description = "Impact Ventures: Venture Building in Global Growth Markets is a year-long course for MIT Kuo Sharper Center Student Fellows who are building innovation-driven ventures in Global Growth Markets (GGMs) across Africa, Asia, Latin America, and the Arab World. The course is open to graduate and undergraduate students from MIT who are selected for the fellowship. The course covers three modules: Module 1 — Leadership: adaptive leadership and values-based leadership for founders operating under uncertainty, resource constraint, and ethical complexity. Module 2 — Externalities: the macroeconomic, political, regulatory, and technological forces that shape ventures in Global Growth Markets. Module 3 — Venture Building: the disciplined, evidence-based process of moving a venture from an idea to an investment-ready business. The course involves weekly seminars in addition to workshops and a required international ecosystem tour experience. Course continues into the spring semester."
inCharge = " G. Carolini, D. H. Sherif"

["11.S947"]
name = "Ecology, Sustainability, and Spirituality: (P)reparative Planning and Planetary Health"
lectureUnits = 2
labUnits = 0
preparationUnits = 10
isVariableUnits = false
description = "This course analyzes how historical and cross-cultural ecological and spiritual traditions offer models of relationship among human, “more-than-human,” and other actors. These models of living may be both reparative—redressing past harms—and preparative—offering instructions on how best to mitigate future disruptions of our various ecosystems. We will explore global perspectives on embodiment, kinship, environmental stewardship, spirituality, and planetary health."
inCharge = "E. Caple James"
