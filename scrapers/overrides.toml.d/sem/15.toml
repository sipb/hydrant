["15.S51"]
level = "G"
description = "Real Life Lessons in the context of M&A, Restructuring, Public Offering, Private Investment and Other Transactions. Examines common complex deals a business leader will encounter, including VC and PE financings, M&A, restructurings and bankruptcy, public offerings, hostile transactions, cross-border deals and transactions in a crisis. Focus is on how business leaders make decisions under pressure. Students will evaluate real-world transactions, board-level dilemmas, term sheets and deal documents, legal compliance, and negotiation scenarios and failures. The instructor has 30+ years of hands-on transactional practice in leading private law firms. No prerequisites required or recommended.  Undergrads welcome."
name = "Transactions, Strategic Dealmaking, and the Law"
inCharge = "H. Stone"
lectureUnits = 3
labUnits = 0
preparationUnits = 3
isVariableUnits = false
