# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      "react-router":
        patterns:
          - "react-router"
          - "@react-router/*"
      "react":
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      "rjsf":
        patterns:
          - "@rjsf/*"
      "chakra-ui":
        patterns:
          - "@chakra-ui/*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
