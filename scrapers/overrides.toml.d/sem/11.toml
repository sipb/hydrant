["11.S195"]
name = "Indigenous Water and Energy Planning and Policy: Part 1 (Introduction)"
description = "Introduces Indigenous approaches to water and energy planning, with emphasis on climate resilience, community-led research, and Indigenous sovereignty. Prepares students for field-based collaboration with Māori researchers and communities in Aotearoa New Zealand. Covers Indigenous water governance, energy planning, reflexive practice, community partnership, kaupapa Māori research methodologies, mātauranga Māori, Te Tiriti o Waitangi, and ethical responsibilities in cross-cultural planning work. Includes case-based learning, discussion of integrated land-water-resource planning frameworks, and engagement with project partners associated with Wai Ora, Kāinga Ora, a Māori-led research program addressing climate impacts on waterways, ecosystems, and kāinga wellbeing. Students develop a pre-departure project brief and positionality statement to support respectful, reciprocal participation in the related Global Classroom field subject."
inCharge = "J. Knox-Hayes"
level = "U"
lectureUnits = 3
labUnits = 0
preparationUnits = 3
isVariableUnits = false
meets = "11.S945"

["11.S938"]
name = "Advanced Seminar on the Role of History in Planning the Just City"
lectureUnits = 4
labUnits = 0
preparationUnits = 8
isVariableUnits = false
description = "This practicum brings together MIT CoLab, GROUND3D, Brooklyn Level Up (BKLVLUP), and the Central Brooklyn Economic Development Corporation (CBEDC) to advance community- led infrastructure planning in Central Brooklyn. Students will work at the intersection of climate resilience, community development, and transit-oriented development (TOD), using the proposed Interborough Express (IBX) as a catalyst for equitable neighborhood investment.\n\nStudents will support community partners in answering a central question: How can IBX investment be leveraged to strengthen—rather than destabilize—existing communities through resident-led planning, resilience infrastructure, and equitable development strategies?\n\nContext + Opportunity\nThe IBX corridor will connect historically underserved neighborhoods, serving over 900,000 residents and 260,000 workers. Without coordinated planning, similar investments have resulted in displacement, rising property values, and extractive development disconnected from community needs.\n\nThis practicum focuses on Brownsville and East Flatbush—neighborhoods shaped by strong community networks alongside long-standing disinvestment and climate vulnerability. "
inCharge = "H. Harriel"

["11.S939"]
name = "Advanced Seminar on the Role of History in Planning the Just City"
lectureUnits = 2
labUnits = 0
preparationUnits = 4
isVariableUnits = false
description = "Builds on the foundation acquired in 11.242 H1 on the theory and practice of history and its role in planning the just city. Through the design and completion of an individual research project, students apply historical research methods to explore how overlooked or silenced histories can be unearthed, honored, and told through urban design and planning."
inCharge = "A. Spirn"
prereqs = "11.242 or permission of instructor."

